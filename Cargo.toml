[package]
name = "kilna-plugin-cut"
version = "0.4.0"
description = "Builds a short out of the stretches kilna keeps for it, under the look of its channel: the picture, the ground, the stamp, a sign that moves with the sound, the words lit as they are sung, and its cover at the end."
authors = ["Kirill Lakhtachev <lahtachev@gmail.com>"]
license = "MIT"
repository = "https://github.com/lacodda/kilna-plugin-cut"
edition = "2024"
rust-version = "1.85"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
strip = true
lto = "thin"
